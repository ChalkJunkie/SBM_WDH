  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seifenblasen">

<body class="seite-lesen">

  <header class="kopf">
    <a class="knopf" href="index.html">← Übersicht</a>
    <h1 id="titel">Genau lesen</h1>
    <nav class="aufgabenwahl" id="aufgabenwahl" aria-label="Aufgabe wählen"></nav>
  </header>

  <main class="lesen-spiel">
    <!-- Links: die Aufgabenstellung wie in einer Klassenarbeit -->
    <section class="lesen-blatt" id="blatt" aria-label="Aufgabenstellung"></section>

    <!-- Rechts: Fragen zur Aufgabenstellung, darunter die Knöpfe -->
    <section class="lesen-rechts" aria-label="Fragen">
      <div class="lesen-fragen" id="fragen"></div>
      <footer class="fussleiste">
        <div id="zusammenfassung" class="zusammenfassung" aria-live="polite"></div>
        <button type="button" class="knopf" id="neustart">↺ Von vorne</button>
        <button type="button" class="knopf haupt" id="pruefen">✔ Prüfen</button>
      </footer>
    </section>
  </main>
