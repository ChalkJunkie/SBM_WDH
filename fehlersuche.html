<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Vom Home-Bildschirm gestartet: ohne Safari-Leisten (wie eine App) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seifenblasen">
  <meta name="theme-color" content="#0b5cad">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Fehlersuche – Seifenblasenmaschine</title>
  <link rel="stylesheet" href="css/stil.css?v=2026-11-11c">
</head>
<body class="seite-code seite-fehlersuche">

  <header class="kopf">
    <a class="knopf" href="index.html">← Übersicht</a>
    <h1 id="titel">Fehlersuche</h1>
    <nav class="aufgabenwahl" id="aufgabenwahl" aria-label="Aufgabe wählen"></nav>
  </header>

  <main class="fs-spiel">
    <!-- Links: was das Programm tun soll -->
    <section class="fs-links" aria-label="Programmablaufplan und Verkabelung">
      <h2>So soll das Programm ablaufen</h2>
      <div id="pap" class="pap-behaelter"></div>
      <table class="verkabelung" id="verkabelung"></table>
    </section>

    <!-- Rechts: der Code mit Fehlern -->
    <!-- Die Fußleiste ist nur so breit wie der Code: links bleibt mehr Platz für den PAP -->
    <section class="fs-rechts" aria-label="Programmcode">
      <div class="code-bereich">
        <p class="auftrag"><strong id="anzahl"></strong> Tippe die falschen Zeilen an (nochmal antippen hebt die Markierung auf). Fehlt eine ganze Zeile, tippe die Zeile an, <strong>vor</strong> der sie fehlt.</p>
        <ol class="codeliste" id="codeliste"></ol>
      </div>

      <!-- Unten: Knöpfe und kurze Rückmeldung -->
      <footer class="fussleiste">
        <div id="zusammenfassung" class="zusammenfassung" aria-live="polite"></div>
        <button type="button" class="knopf" id="neustart">↺ Von vorne</button>
        <button type="button" class="knopf haupt" id="pruefen">✔ Prüfen</button>
      </footer>
    </section>
  </main>

  <script>window.DATEN = {};</script>
  <script src="js/gemeinsam.js?v=2026-11-11c"></script>
  <script src="data/aufgaben.js?v=2026-11-11c"></script>
  <script src="data/code.js?v=2026-11-11c"></script>
  <script src="data/dokumente.js?v=2026-11-11c"></script>
  <script src="data/fehlersuche.js?v=2026-11-11c"></script>
  <script src="data/vergleich.js?v=2026-11-11c"></script>
  <script src="data/lesen.js?v=2026-11-11c"></script>
  <script src="js/codeanzeige.js?v=2026-11-11c"></script>
  <script src="js/pap.js?v=2026-11-11c"></script>
  <script src="js/fehlersuche.js?v=2026-11-11c"></script>
</body>
</html>
